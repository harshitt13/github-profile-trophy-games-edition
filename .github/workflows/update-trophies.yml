name: Update trophies
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-trophies
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Generate SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.TROPHY_TOKEN || github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: deno task generate "$PROFILE_USERNAME"
      - name: Commit trophy only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update profile trophies"
          git push
